definitions:
  main.FailureInternalServerErrorResponse:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  main.FailureInvalidBodyResponse:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  main.LoginData:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  main.LoginFailureTokenErrorResponse:
    properties:
      error:
        example: Error creating token
        type: string
    type: object
  main.LoginFailureUnauthorizedResponse:
    properties:
      error:
        example: Could not find requested user-Wrong password
        type: string
    type: object
  main.LoginSuccessResponse:
    properties:
      success:
        example: Connection successfull
        type: string
    type: object
  main.ModifyPasswordData:
    properties:
      password:
        type: string
    type: object
  main.ModifyPasswordFailureEmailNotValidResponse:
    properties:
      errorr:
        example: Email is not a valid string
        type: string
    type: object
  main.ModifyPasswordFailureInternalServerErrorResponse:
    properties:
      error:
        example: Failed to hash password-Could not modify the password
        type: string
    type: object
  main.ModifyPasswordSuccessResponse:
    properties:
      success:
        example: Password modified
        type: string
    type: object
  main.RegisterFailureEmailAlreadyUsedResponse:
    properties:
      error:
        example: Email address already used
        type: string
    type: object
  main.RegisterSuccessResponse:
    properties:
      success:
        example: New user created
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Documentation for AREA Rest API
paths:
  /login:
    post:
      consumes:
      - application/json
      description: User Authentication
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.LoginData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.FailureInvalidBodyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.LoginFailureUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.LoginFailureTokenErrorResponse'
      summary: Login
      tags:
      - Users
  /modify-password:
    put:
      consumes:
      - application/json
      description: Modify the user password
      parameters:
      - description: New password of the user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.ModifyPasswordData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ModifyPasswordSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ModifyPasswordFailureEmailNotValidResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ModifyPasswordFailureInternalServerErrorResponse'
      summary: Modify Password
      tags:
      - Users
  /register:
    post:
      consumes:
      - application/json
      description: Create user account
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.LoginData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.FailureInvalidBodyResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.RegisterFailureEmailAlreadyUsedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.FailureInternalServerErrorResponse'
      summary: Register
      tags:
      - Users
swagger: "2.0"
