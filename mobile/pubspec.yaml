name: namer_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  auto_size_text: ^3.0.0
  footer: ^0.0.4
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  fluttertoast: ^8.2.8
  flutter_inappwebview: ^6.1.5
  loading_animation_widget: ^1.3.0
  googleapis_auth: ^1.6.0
  url_launcher: ^6.3.1
  flutter_web_auth: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/google_logo.webp
    - assets/icon/facebook_icon.png
    - assets/icon/X-Logo.png
    - assets/icon/apple_logo.png
    - assets/icon/github.png
    - assets/icon/spotify.png
    - assets/icon/youtube.png
    - assets/icon/noImage.png
    - .env
