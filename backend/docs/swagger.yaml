definitions:
  docs_service.ActionExample:
    properties:
      Description:
        example: This Trigger fires every single day at a specific time set by you.
        type: string
      Id:
        example: 2685fc54-d1e2-43d8-9525-56ab7a91e351
        type: string
      Name:
        example: Every day at
        type: string
      ServiceId:
        example: 203a1f6a-b2d7-4011-a73b-e9585907835b
        type: string
      nbParam:
        type: integer
    type: object
  docs_service.ReactionExample:
    properties:
      Description:
        example: Start a new context or resume current playback on the user’s active
          device. Only available for Spotify premium accounts.
        type: string
      Id:
        example: 5dccb0f3-64db-4456-8286-4678857ae394
        type: string
      Name:
        example: Start playback
        type: string
      ServiceId:
        example: 4f6f8655-8e0f-4f96-ba7f-d3cab1577b74
        type: string
      nbParam:
        type: integer
    type: object
  docs_service.ServiceExample:
    properties:
      Color:
        example: '#E84A4A'
        type: string
      Logo:
        example: assets/logos/Google.webp
        type: string
      Name:
        example: Google
        type: string
    type: object
  docs_service.ServiceInternalServerErrorResponse:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  docs_service.ServiceOAuth2BadRequestResponse:
    properties:
      error:
        example: Invalid callback type
        type: string
    type: object
  docs_service.ServiceOAuth2SuccessResponse:
    properties:
      auth-url:
        example: url-example.com
        type: string
    type: object
  docs_service.ServiceRetrieveActionsFromServiceSuccessResponse:
    properties:
      actions:
        items:
          $ref: '#/definitions/docs_service.ActionExample'
        type: array
    type: object
  docs_service.ServiceRetrieveActionsReactionsServicesSuccessResponse:
    properties:
      services:
        items:
