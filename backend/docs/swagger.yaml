host: localhost:8080
info:
  contact: {}
  title: Documentation for AREA Rest API
paths:
  /{service}/actions:
    get:
      description: Retrieve actions from requested service
      parameters:
      - description: Service name (Google, Spotify, Time & Date..)
        in: path
        name: service
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceRetrieveActionsFromServiceSuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_service.ServiceInternalServerErrorResponse'
      summary: Actions From Service
      tags:
      - Services
  /{service}/reactions:
    get:
      description: Retrieve reactions from requested service
      parameters:
      - description: Service name (Google, Spotify, Time & Date..)
        in: path
        name: service
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceRetrieveReactionsFromServiceSuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_service.ServiceInternalServerErrorResponse'
      summary: Reactions From Service
      tags:
      - Services
  /actions-services:
    get:
      description: Retrieve services with actions available
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceRetrieveActionsReactionsServicesSuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_service.ServiceInternalServerErrorResponse'
      summary: Actions Services
      tags:
      - Services
  /authentication/Google/{callback-type}:
    get:
      description: Get Google OAuth2 URL
      parameters:
      - description: Callback type (login or service)
        in: path
        name: callback-type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceOAuth2SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_service.ServiceOAuth2BadRequestResponse'
      summary: Google OAuth2
      tags:
      - Services Authentication
  /authentication/Spotify/{callback-type}:
    get:
      description: Get Spotify OAuth2 URL
      parameters:
      - description: Callback type (login or service)
        in: path
        name: callback-type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceOAuth2SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_service.ServiceOAuth2BadRequestResponse'
      summary: Spotify OAuth2
      tags:
      - Services Authentication
  /login:
    post:
      consumes:
      - application/json
      description: User Authentication
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/entities.UserCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserLoginSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_user.UserInvalidBodyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_user.UserLoginUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_user.UserLoginTokenErrorResponse'
      summary: Login
      tags:
      - Users
  /login-callback/{service}:
    post:
      description: Callback for login
      parameters:
      - description: Service name (Google, Spotify..)
        in: path
        name: service
        required: true
        type: string
      - description: Authorization code given by the service
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserLoginCallbackSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_user.UserLoginCallbackBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_user.UserLoginCallbackInternalServerErrorResponse'
      summary: Login Callback
      tags:
      - Callbacks
  /reactions-services:
    get:
      description: Retrieve services with reactions available
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_service.ServiceRetrieveActionsReactionsServicesSuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_service.ServiceInternalServerErrorResponse'
      summary: Reactions Services
      tags:
      - Services
  /register:
    post:
      consumes:
      - application/json
      description: Create user account
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/entities.UserCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserRegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_user.UserRegisterBadRequestResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/docs_user.UserRegisterConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_user.UserInternalServerErrorResponse'
      summary: Register
      tags:
      - Users
  /service-callback/{service}:
    post:
      description: Callback for services
      parameters:
      - description: Service name (Google, Spotify..)
        in: path
        name: service
        required: true
        type: string
      - description: Authorization code given by the service
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_userservice.UserServiceServiceCallbackSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_userservice.UserServiceServiceCallbackBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_userservice.UserServiceServiceCallbackInternalServerErrorResponse'
      summary: Service Callback
      tags:
      - Callbacks
  /user/delete-account:
    delete:
      consumes:
      - application/json
      description: Delete the user account
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserDeleteAccountSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_user.UserDeleteAccountUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_user.UserDeleteAccountInternalServerErrorResponse'
      summary: Delete Account
      tags:
      - Users
  /user/email:
    get:
      description: Get the email of user connected
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserGetUserEmailSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_user.UserGetUserEmailUnauthorizedResponse'
      summary: Get User Email
      tags:
      - Users
  /user/modify-password:
    put:
      consumes:
      - application/json
      description: Modify the user password
      parameters:
      - description: New password of the user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/entities.UserModifyPassword'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_user.UserModifyPasswordSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_user.UserModifyPasswordBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_user.UserModifyPasswordUnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/docs_user.UserModifyPasswordOldPasswordNotValidResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_user.UserModifyPasswordInternalServerErrorResponse'
      summary: Modify Password
      tags:
      - Users
  /workflow/create:
    post:
      description: Create a Workflow
      parameters:
      - description: Workflow informations
        in: body
        name: workflow
        required: true
        schema:
          $ref: '#/definitions/entities.NewWorkflow'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowCreateWorkflowSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowCreateWorkflowBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowCreateWorkflowUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowCreateWorkflowInternalServerErrorResponse'
      summary: Create Workflow
      tags:
      - Workflow
  /workflow/modify-activation:
    put:
      description: Modify the activation status of the specified workflow
      parameters:
      - description: Workflow informations
        in: body
        name: workflow
        required: true
        schema:
          $ref: '#/definitions/entities.ChangeActivationWorkflow'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowModifyWorkflowActivationStatusSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowModifyWorkflowActivationStatusBadRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowModifyWorkflowActivationStatusInternalServerErrorResponse'
      summary: Modify Workflow Activation Status
      tags:
      - Workflow
  /workflow/retrieve:
    get:
      description: Retrieve the workflows of the user actually connected
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowRetrieveUserWorkflowsSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowRetrieveUserWorkflowsUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/docs_workflow.WorkflowRetrieveUserWorkflowsInternalServerErrorResponse'
      summary: Retrieve User's Workflows
      tags:
      - Workflow
swagger: "2.0"
