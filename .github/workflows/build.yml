name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build backend
        working-directory: backend
        run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web client
        working-directory: frontend
        run: |
          npm install
          npm run build
