name: backend

on:
  pull_request:
    branches: ["main", "dev"]

jobs:
  check-compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend compilation
        run: |
          cd backend
          go build main.go
           if [ $? -ne 0 ]; then
            echo "Compilation failed."
            exit 1
          else
            echo "Compilation succeed."
            exit 0
          fi

  check-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run swag init
        run: |
          cd backend
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "$HOME/go/bin" >> $GITHUB_PATH
          go install github.com/swaggo/swag/cmd/swag@latest
          echo "PATH: $PATH"
          echo "GOPATH: $GOPATH"
          ls -la $GOPATH/bin
          swag init

      - name: Push swagger documentation updates
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add backend
            git commit -m "docs(back-end): :memo: update swagger documentation"
            git push -f origin "HEAD:${{ github.head_ref }}"
          fi

  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Golang formatting
        run: |
          cd backend
          gofmt -w -s .

      - name: Push formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add backend
            git commit -m "style(back-end): :art: format code"
            git push -f origin "HEAD:${{ github.head_ref }}"
          fi
